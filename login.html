<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/all.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container-fluid">

            <div class="header-content">
                <a href="index.html" class="brand">Lavender</a>

                <nav>
                    <ul id="links" class="linkss">
                        <li><a href="login.html">Sign in</a></li>
                        <li><a href="register.html">Sign up</a></li>
                    </ul>
                    <ul id="user_info" class="linkss align-items-center">
                        <li><a href="#" id="user"></a></li>
                        <li class="shopping-cart mx-2">
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span class="badge"></span>
                            <div class="cart-products">
                                <div></div>
                                <a href="cartproducts.html">View all products</a>
                            </div>
                    </li>
                    <li><a href="login.html" id="logout">Log Out</a></li>
                    </ul>
                </nav>
            </div>

        </div>
    </header>

    <section>
        <div class="form-container" id="logcontainer">
            <form class="form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input required="" name="email" id="email" type="text">
                </div>
                <div class="form-group">
                    <label for="textarea">Password</label>
                    <input type="password" required="" id="password" name="password" min="8" max="30"></input>
                </div>
                <button type="submit" class="form-submit-btn" value="login" id="login">Login</button>
                <p>Don't have an account? <a href="register.html" class="log text-info text-decoration-none">Register</a></p>
            </form>
        </div>  
    </section>


                    

    <script src="js/bootstrap.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
