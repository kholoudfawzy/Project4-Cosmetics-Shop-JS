<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/all.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container-fluid">

            <div class="header-content">
                <a href="index.html" class="brand">Lavender</a>

                <nav>
                    <ul id="links">
                        <li><a href="login.html">Sing in</a></li>
                        <li><a href="register.html">Sign up</a></li>
                    </ul>
                    <ul id="user_info">
                    <li><a href="#" id="user"></a></li>
                    </ul>
                </nav>
            </div>
                
        </div>
    </header> 

    <section>
        <div class="form-container" id="regcontainer">
            <form class="form">
                <div class="form-group">
                    <label for="text">Frist Name*</label>
                    <input required="" name="frist name" id="fristname" type="text">
                </div>
                <div class="form-group">
                    <label for="text">Last Name*</label>
                    <input required="" name="last name" id="lastname" type="text">
                </div>
                <div class="form-group">
                    <label for="email">Email*</label>
                    <input required="" name="email" id="email" type="text">
                </div>
                <div class="form-group">
                    <label for="password">Password*</label>
                    <input required="" id="password" name="password" min="8" max="30"></input>
                </div>
                <button type="submit" class="form-submit-btn" value= "sign up" id="sign_up">Sign Up</button>
                <p>Have an account? <a href="login.html" class="regist text-info text-decoration-none">Login</a></p>
            </form>
        </div>  
    </section>
                    

    <script src="js/bootstrap.min.js"></script>
    <script src="js/register.js"></script>
    <script src="js/user.js"></script>
</body>
</html>
